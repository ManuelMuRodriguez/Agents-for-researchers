services:
  jupyter:
    image: python:3.11-slim
    container_name: vibration_analysis
    working_dir: /workspace
    volumes:
      - .:/workspace
    ports:
      - "8888:8888"
    command: >
      bash -c "pip install --quiet numpy matplotlib scipy jupyter &&
               jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root"
